<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1e293b">
<title>Hyllytys – WMS</title>
<link rel="stylesheet" href="hyllytys.css">
</head>
<body>
<div id="scan-wrap">
  <div style="display:flex;gap:8px;align-items:center">
    <input type="text" id="scan-field" class="scan-input" inputmode="numeric" placeholder="Skannaa viivakoodi" style="flex:1" autocomplete="off">
    <button id="cam-toggle" class="cam-btn" type="button">📷</button>
  </div>
  <div id="cam-overlay" style="display:none;margin-top:8px">
    <div class="cam-box">
      <video id="cam-video" playsinline webkit-playsinline autoplay muted></video>
      <div class="cam-frame"></div>
      <div id="cam-flash" class="cam-flash"></div>
    </div>
    <button id="cam-close" type="button" class="btn-sm btn-danger" style="width:100%;margin-top:6px;font-size:13px">Sulje kamera</button>
  </div>
</div>
<div class="app" id="app"></div>
<script type="module" src="hyllytys.js"></script>
</body>
</html>
