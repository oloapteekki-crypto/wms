<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#288264">
<title>Inventointi – WMS</title>
<link rel="stylesheet" href="inventointi.css">
</head>
<body>
<div id="cam-wrap">
  <div class="cam-box">
    <video id="cam-video" playsinline webkit-playsinline autoplay muted></video>
    <div class="cam-frame"></div>
    <div id="cam-flash" class="cam-flash"></div>
  </div>
</div>
<div id="scan-wrap">
  <input type="text" id="scan-field" class="scan-input" inputmode="numeric" placeholder="Skannaa viivakoodi" autocomplete="off">
</div>
<div class="app" id="app"></div>
<script type="module" src="inventointi.js"></script>
</body>
</html>
