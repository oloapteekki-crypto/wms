<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siirrot – WMS</title>
<link rel="stylesheet" href="../../styles/theme.css">
</head>
<body>
<a class="back" href="../../../index.html">← WMS</a>
<h1>Siirrot</h1>

<div id="login-view" style="display:none"></div>

<div id="loading-view" class="loading">
  <div class="icon">⏳</div>
  <div class="msg">Haetaan dataa...</div>
  <div id="load-error" class="error-box" style="display:none"></div>
  <button class="btn" id="retry-btn" style="display:none;margin-top:1rem;width:auto;padding:10px 20px">🔄 Yritä uudelleen</button>
</div>

<div id="main-view" style="display:none">
  <div class="controls">
    <select id="worker-sel" aria-label="Käyttäjä"></select>
    <select id="count-sel" aria-label="Erän koko">
      <option value="10">Erä 10</option>
      <option value="20" selected>Erä 20</option>
      <option value="30">Erä 30</option>
      <option value="50">Erä 50</option>
    </select>
  </div>
  <div class="status-row" id="team-strip" style="margin-bottom:.75rem"></div>
  <div class="controls">
    <div class="phase-toggle">
      <button class="phase-btn active" id="btn-pick">🧺 Keräily</button>
      <button class="phase-btn" id="btn-put">📥 Hyllytys</button>
    </div>
  </div>

  <div id="take-view" style="display:none">
    <div class="summary">
      <h2>Ota siirtoja</h2>
      <p>Saat oman erän vapaista siirroista. Muut näkevät ne varattuina, eikä kukaan muu saa samoja.</p>
      <button class="btn primary" id="take-btn">Ota erä</button>
    </div>
  </div>

  <div class="progress-wrap"><div class="progress-fill" id="prog"></div></div>
  <div class="status-row">
    <span id="phase-label"></span>
    <span id="done-count">0 / 0</span>
  </div>
  <div id="cards-container"></div>
  <button class="btn" id="release-btn" style="display:none;margin-top:.75rem">Vapauta keräämättömät muille</button>
  <div id="summary-view" style="display:none">
    <div class="summary">
      <h2 id="sum-title"></h2>
      <p id="sum-sub"></p>
      <div class="stat-row">
        <div class="stat"><div class="stat-val" id="sum-done">0</div><div class="stat-lbl">käsitelty</div></div>
        <div class="stat"><div class="stat-val" id="sum-skip">0</div><div class="stat-lbl">ohitettu</div></div>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="next-phase-btn">—</button>
        <button class="btn" id="reset-btn">Uusi lenkki</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="siirrot.js"></script>
</body>
</html>
